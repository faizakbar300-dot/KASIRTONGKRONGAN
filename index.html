<style>
:root{
  color-scheme:light;
  --bg:#F8F2EC; --surface:#FFFFFF; --surface2:#FBF6F1; --ink:#2B1A17; --muted:#7B665F; --line:#EBDFD6;
  --accent:#C8281E; --accent-ink:#FFFFFF; --accent-soft:#FCE6E1; --amber:#F2A02C; --amber-ink:#2E1B00;
  --hdr-a:#6E0D0D; --hdr-b:#C8281E; --sh:0 1px 2px rgba(80,20,10,.06),0 8px 24px rgba(80,20,10,.07);
  --good:#1E7A4B; --good-bg:#DDF1E5; --warn:#A65A05; --warn-bg:#FBEBD3; --bad:#B3261E; --bad-bg:#F9DEDC; --info:#5B3FB8; --info-bg:#EAE4F9;
  --font:"Figtree",system-ui,-apple-system,"Segoe UI",sans-serif;
}
@media (prefers-color-scheme:dark){
  :root{color-scheme:dark;--bg:#170E0D;--surface:#241615;--surface2:#2E1C1A;--ink:#F6EAE6;--muted:#B79E96;--line:#3E2824;
    --accent:#FF6B5E;--accent-ink:#2A0603;--accent-soft:#4A1D19;--hdr-a:#4A0808;--hdr-b:#A3211A;--sh:0 1px 2px rgba(0,0,0,.45);
    --good:#6FD39A;--good-bg:#1D3A2A;--warn:#F0B35E;--warn-bg:#3D2E14;--bad:#F2938C;--bad-bg:#43201E;--info:#B7A4F5;--info-bg:#2A2347}
}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:radial-gradient(900px 420px at 50% -120px,color-mix(in srgb,var(--accent) 9%,transparent),transparent),var(--bg);background-attachment:fixed;color:var(--ink);font:15px/1.45 var(--font);padding:12px 16px 120px;padding-left:max(16px,env(safe-area-inset-left));padding-right:max(16px,env(safe-area-inset-right))}
.wrap{max-width:1200px;margin:0 auto}
h1,h2,h3{margin:0;line-height:1.2}
h3{font-size:17px}
p{margin:0}
button{font:inherit;color:inherit;cursor:pointer}
ul{list-style:none;margin:0;padding:0}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.num{font-variant-numeric:tabular-nums}
.muted,.hint{color:var(--muted)}
.hint{font-size:13px}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
.inp{width:100%;min-height:44px;padding:9px 12px;border:1px solid var(--line);border-radius:10px;background:var(--surface);color:var(--ink);font:inherit;font-size:16px}
.inp.sm{min-height:38px;padding:6px 10px;font-size:14px}
.inp:focus{outline:none;border-color:var(--accent);box-shadow:0 0 0 3px color-mix(in srgb,var(--accent) 22%,transparent)}
textarea.inp{min-height:68px;resize:vertical}
label.f{display:grid;gap:5px;font-size:13px;font-weight:600;color:var(--muted);min-width:0}
.btn{min-height:44px;padding:0 18px;border:1px solid var(--accent);border-radius:10px;background:linear-gradient(180deg,color-mix(in srgb,var(--accent) 92%,#fff),var(--accent));color:var(--accent-ink);font-weight:700;box-shadow:0 1px 2px rgba(80,20,10,.2),0 4px 10px color-mix(in srgb,var(--accent) 22%,transparent);transition:filter .15s,transform .1s}
.btn:active{transform:translateY(1px)}
.btn:hover{filter:brightness(1.07)}
.btn.sm{min-height:36px;padding:0 14px;font-size:14px}
.btn.ghost{background:transparent;color:var(--ink);border-color:var(--line);box-shadow:none}
.btn.ghost:hover{background:var(--surface2);filter:none}
.btn.danger{background:var(--bad);background-image:none;border-color:var(--bad);color:#fff}
.btn.danger-t{color:var(--bad)}
.btn.amber{background:var(--amber);background-image:none;border-color:var(--amber);color:var(--amber-ink)}
.btn.big{min-height:50px;border-radius:99px;font-size:16px}
.btn:disabled{opacity:.45;cursor:not-allowed}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:18px;box-shadow:var(--sh)}
.stack{display:grid;gap:14px}
.two{display:grid;gap:10px;grid-template-columns:minmax(0,1fr) minmax(0,1fr)}
.two-col{display:grid;gap:14px;grid-template-columns:repeat(auto-fit,minmax(min(100%,340px),1fr));align-items:start}

async function hash(s){
  try{if(window.crypto&&crypto.subtle){var b=await crypto.subtle.digest('SHA-256',new TextEncoder().encode(s));return Array.from(new Uint8Array(b)).map(function(x){return x.toString(16).padStart(2,'0')}).join('')}}catch(e){}
  var h=5381;for(var i=0;i<s.length;i++)h=((h<<5)+h+s.charCodeAt(i))|0;return 'f'+(h>>>0).toString(16);
}
function pw(u,p){return hash('kasirbiru|'+String(u).toLowerCase()+'|'+p)}

function pd(v,fb){var p=String(v||'').split('-');return p.length===3?new Date(+p[0],+p[1]-1,+p[2]):fb}
function rangeOf(k){
  var n=new Date(),s=new Date(n.getFullYear(),n.getMonth(),n.getDate());
  if(k==='custom'){var a=pd(S.fdate.from,s),b=pd(S.fdate.to||S.fdate.from,s);return [a,new Date(b.getFullYear(),b.getMonth(),b.getDate()+1)]}
  if(k==='date'){var c=pd(S.of.date,s);return [c,new Date(c.getFullYear(),c.getMonth(),c.getDate()+1)]}
  if(k==='today')return [s,new Date(s.getTime()+864e5)];
  if(k==='7d')return [new Date(s.getTime()-6*864e5),new Date(s.getTime()+864e5)];
  if(k==='month')return [new Date(n.getFullYear(),n.getMonth(),1),new Date(n.getFullYear(),n.getMonth()+1,1)];
  return [new Date(0),new Date(8.64e15)];
}
function inRange(o,k){var r=rangeOf(k),t=new Date(o.ts);return t>=r[0]&&t<r[1]}
function rangeLabel(k){
  if(k==='all')return 'Semua data';
  var r=rangeOf(k),a=r[0],b=new Date(r[1].getTime()-1);
  var nm={today:'Hari ini','7d':'7 hari terakhir',month:'Bulan ini',custom:'Periode'}[k]||'';
  return nm+': '+(ymd(a)===ymd(b)?fmtDayS(a):fmtDayS(a)+' s/d '+fmtDayS(b));
}

  if(!me){$('app').innerHTML=loginHTML();updateDock();return}
  if(allowed().indexOf(S.view)<0)S.view='kasir';
  var tabs=isOwner()?[['kasir','Kasir'],['pesanan','Pesanan'],['menu','Menu'],['pengeluaran','Pengeluaran'],['keuangan','Keuangan'],['pengaturan','Pengaturan']]:[['kasir','Kasir'],['pesanan','Pesanan'],['pengaturan','Akun']];
  $('app').innerHTML='<header class="top"><div class="brandrow"><span class="logo">'+logoImg()+'</span><div><div class="brand">'+esc(D.shop)+'</div><div class="clock"><span id="clock"></span><span class="sync" id="sync"></span></div></div></div>'+
    '<div class="who"><span class="avatar" aria-hidden="true">'+esc(me.name.charAt(0).toUpperCase())+'</span><div class="whoin"><span class="uname">'+esc(me.name)+'</span><span class="role '+(isOwner()?'owner':'')+'">'+(isOwner()?'Pemilik':'Kasir')+'</span></div>'+

    '<nav class="tabs" aria-label="Menu utama">'+tabs.map(function(t){return '<button class="tab" data-act="nav" data-v="'+t[0]+'"'+(S.view===t[0]?' aria-current="page"':'')+'>'+svg(IC[t[0]],19)+'<span>'+t[1]+'</span></button>'}).join('')+'</nav><main id="main"></main>';

}
function tick(){var c=$('clock');if(c){var d=new Date();c.textContent=fmtDay(d)+' · pukul '+fmtTime(d)}}
setInterval(tick,20000);
function setView(v){
  if(allowed().indexOf(v)<0)return;
  S.view=v;S.confirm=null;S.payingId=null;S.edit=null;S.resetId=null;S.backupText=null;S.msg={};
  document.querySelectorAll('.tab').forEach(function(b){if(b.dataset.v===v)b.setAttribute('aria-current','page');else b.removeAttribute('aria-current')});
  renderView();window.scrollTo(0,0);
}
function renderView(){
  var m=$('main');if(!m)return;
  m.innerHTML=({kasir:viewKasir,pesanan:viewPesanan,menu:viewMenu,pengeluaran:viewPengeluaran,keuangan:viewKeuangan,pengaturan:viewPengaturan})[S.view]();
  if(S.view==='kasir'){drawCats();drawGrid();drawCart()}
  if(S.view==='pesanan')drawOrders();
  if(S.view==='menu')drawMenuList();
  updateDock();
}
function updateDock(){
  var d=$('dock');
  if(!(me&&S.view==='kasir')){d.hidden=true;return}
  d.hidden=false;
  d.innerHTML='<div><div class="hint">'+cartCount()+' item</div><b class="num">'+rp(cartTotal())+'</b></div><button class="btn big" data-act="tocart"'+(S.cart.length?'':' disabled')+'>Lihat pesanan &amp; bayar</button>';
}

/* ---------- kasir ---------- */
function viewKasir(){
  var sorts=[['name','Nama A–Z'],['low','Harga terendah'],['high','Harga tertinggi']];
  return '<section class="pos"><div class="pos-menu"><div class="searchbar">'+svg(IC.search,22)+
    '<label class="sr" for="q">Cari menu</label><input id="q" data-f="q" type="search" placeholder="Cari menu di sini" value="'+esc(S.q)+'" autocomplete="off">'+
    '<label class="sr" for="sort">Urutkan</label><select id="sort" data-f="sort">'+sorts.map(function(o){return '<option value="'+o[0]+'"'+(S.sort===o[0]?' selected':'')+'>'+o[1]+'</option>'}).join('')+'</select></div>'+
    '<div class="chips cats" id="cats"></div><div class="gsecs" id="grid"></div></div><aside class="pos-cart" id="cart" aria-label="Pesanan baru"></aside></section>';
}
function drawCats(){
  var el=$('cats');if(!el)return;
  el.innerHTML=['Semua','Makanan','Minuman'].map(function(c){return '<button class="chip" data-act="cat" data-v="'+c+'" aria-pressed="'+(S.cat===c)+'">'+c+'</button>'}).join('');
}
function groupMenu(list){
  var g={};list.forEach(function(m){var k=(m.group||'').trim()||'Lainnya';(g[k]=g[k]||[]).push(m)});
  return Object.keys(g).sort(function(a,b){return a==='Lainnya'?1:b==='Lainnya'?-1:a.localeCompare(b,'id')}).map(function(k){return {name:k,items:g[k]}});
}
function drawGrid(){
  var el=$('grid');if(!el)return;
  if(!D.menu.length){el.innerHTML='<div class="empty"><b>Menu masih kosong.</b><br>'+(isOwner()?'Buka tab <b>Menu</b> untuk menambahkan makanan dan minuman secara manual.':'Minta pemilik untuk menambahkan menu terlebih dahulu.')+'</div>';return}
  var q=S.q.trim().toLowerCase();
  var list=D.menu.filter(function(m){return (S.cat==='Semua'||m.cat===S.cat)&&(!q||m.name.toLowerCase().indexOf(q)>=0)});
  list.sort(function(a,b){return S.sort==='low'?a.price-b.price:S.sort==='high'?b.price-a.price:a.name.localeCompare(b.name,'id')});
  if(!list.length){el.innerHTML='<div class="empty">Tidak ada menu yang cocok.</div>';return}
  var card=function(m){
    var n=S.cart.filter(function(i){return i.key==='m:'+m.id}).reduce(function(s,i){return s+i.qty},0);
    return '<button class="item'+(n?' sel':'')+'" data-act="add" data-id="'+m.id+'"'+(m.active?'':' disabled')+'>'+(n?'<span class="badge">'+n+'</span>':'')+
      '<span class="nm">'+esc(m.name)+'</span><span class="pr num">'+(m.active?rp(m.price):'Habis')+'</span></button>';
  };
  el.innerHTML=['Makanan','Minuman'].map(function(c){
    var items=list.filter(function(m){return m.cat===c});if(!items.length)return '';
    return '<section class="gsec"><h3 class="gh">'+c+'</h3>'+groupMenu(items).map(function(g){
      return (g.name==='Lainnya'&&groupMenu(items).length===1?'':'<div class="hint" style="font-weight:700">'+esc(g.name)+'</div>')+'<div class="grid">'+g.items.map(card).join('')+'</div>';
    }).join('')+'</section>';
  }).join('');
}
function drawCart(){
  var el=$('cart');if(!el)return;
  var f=S.f,whenVal=f.when||toLocalInput(new Date());
  function line(i){
    return '<li class="ci"><div class="ci-top"><span>'+esc(i.name)+' ('+i.qty+'x)</span><span class="num">'+rp(i.price*i.qty)+'</span></div>'+
      '<div class="ci-ctl"><div class="qty"><button data-act="dec" data-k="'+esc(i.key)+'" aria-label="Kurangi">−</button><span class="num">'+i.qty+'</span><button data-act="inc" data-k="'+esc(i.key)+'" aria-label="Tambah">+</button></div>'+
      '<input class="inp sm ci-note" data-f="inote" data-k="'+esc(i.key)+'" placeholder="Catatan (mis. tanpa gula)" value="'+esc(i.note)+'" aria-label="Catatan untuk '+esc(i.name)+'"></div></li>';
  }
  var base=S.cart.filter(function(i){return !i.custom}),extra=S.cart.filter(function(i){return i.custom});
  var body=S.cart.length?(base.length?'<ul>'+base.map(line).join('')+'</ul>':'')+(extra.length?'<div class="xhead">Pesanan di luar menu</div><ul>'+extra.map(line).join('')+'</ul>':''):'<p class="cart-empty">Belum ada pesanan. Ketuk menu untuk menambahkan.</p>';
  var head='<div class="cart-h"><span class="ono num">'+num(D.seq+1)+'</span><input class="cname" data-f="customer" value="'+esc(f.customer)+'" placeholder="Nama pemesan" aria-label="Nama pemesan" autocomplete="off">'+
    '<button class="icon-btn" data-act="detail" aria-expanded="'+S.showDetail+'" aria-label="Detail pesanan"><svg viewBox="0 0 24 24" width="22" height="22" fill="currentColor">'+IC.dots+'</svg></button></div>';
  var detail=S.showDetail?'<div class="cart-detail">'+
    '<label class="f" for="fw">Waktu pesanan<input class="inp sm" id="fw" data-f="when" type="datetime-local" value="'+whenVal+'"></label>'+
    (f.when?'<div><button class="btn ghost sm" data-act="whennow" type="button">Pakai waktu sekarang</button></div>':'')+
    '<label class="f" for="ft">Meja / no. antrean<input class="inp sm" id="ft" data-f="table" value="'+esc(f.table)+'" placeholder="Opsional" autocomplete="off"></label>'+
    '<label class="f" for="fn">Keterangan tambahan<textarea class="inp sm" id="fn" data-f="note" placeholder="mis. dibungkus, pedas">'+esc(f.note)+'</textarea></label></div>':'';
  var cform=S.showCustom?'<form class="cform" data-form="custom" autocomplete="off"><label class="f">Nama pesanan<input class="inp sm" name="name" placeholder="mis. Telur ceplok tambahan" required></label>'+
    '<div class="two"><label class="f">Harga (Rp)<input class="inp sm" name="price" inputmode="numeric" required></label><label class="f">Jumlah<input class="inp sm" name="qty" inputmode="numeric" value="1" required></label></div>'+
    '<button class="btn sm" type="submit">Tambah ke pesanan</button></form>':'';
  var paysheet=S.paySheet?'<div class="cform"><div class="hint lbl">Bayar dengan (disimpan sebagai Lunas)</div><div class="three">'+METHODS.map(function(m){return '<button class="btn ghost" data-act="paywith" data-v="'+m+'">'+m+'</button>'}).join('')+'</div><button class="btn ghost sm" data-act="closepay">Batal</button></div>':'';
  var dis=S.cart.length?'':' disabled';
  var foot='<div class="cart-foot"><button class="rowbtn" data-act="svc"><span>'+esc(f.svc)+'</span>'+svg(IC.chev,20)+'</button>'+
    '<button class="rowbtn" data-act="customtoggle"><span>'+(S.showCustom?'− Tutup pesanan di luar menu':'+ Pesanan di luar menu')+'</span></button>'+cform+
    '<div><div class="hint lbl">Simpan sebagai</div><div class="seg" role="group" aria-label="Status pembayaran">'+
      '<button type="button" class="u" data-act="pay" data-v="waiting" aria-pressed="'+(f.pay==='waiting')+'">Menunggu</button>'+
      '<button type="button" class="k" data-act="pay" data-v="collective" aria-pressed="'+(f.pay==='collective')+'">Kolektif</button>'+
      '<button type="button" class="p" data-act="pay" data-v="paid" aria-pressed="'+(f.pay==='paid')+'">Lunas</button></div>'+
      (f.pay==='collective'?'<p class="hint" style="margin-top:6px">Kolektif: tagihan digabung dan dibayar bersama nanti.</p>':'')+
      (f.pay==='paid'?'<div class="chips" style="margin-top:8px">'+METHODS.map(function(m){return '<button type="button" class="chip" data-act="method" data-v="'+m+'" aria-pressed="'+(f.method===m)+'">'+m+'</button>'}).join('')+'</div>':'')+'</div>'+
    '<div class="total"><span>Total Harga</span><b class="num">'+rp(cartTotal())+'</b></div>'+paysheet+
    '<div class="cta"><button class="btn amber" data-act="save"'+dis+'>Simpan Pesanan</button><button class="btn" data-act="bayar"'+dis+'>Bayar</button></div></div>';
  el.innerHTML=lastBox()+head+detail+'<div class="cart-body">'+body+'</div>'+foot;
  updateDock();
}
function lastBox(){
  var o=S.last&&D.orders.filter(function(x){return x.id===S.last})[0];if(!o)return '';
  return '<div class="lastbox"><span>Pesanan '+num(o.no)+' tersimpan</span><span class="acts"><button class="btn sm" data-act="printrc" data-id="'+o.id+'">Cetak struk</button><button class="btn ghost sm" data-act="lastx" aria-label="Tutup">✕</button></span></div>';
}
function addToCart(key,name,price,custom){
  var it=S.cart.filter(function(i){return i.key===key})[0];
  if(it)it.qty++;else S.cart.push({key:key,name:name,price:price,qty:1,note:'',custom:!!custom});
}
var ordBusy=false;
async function saveOrder(status){if(ordBusy)return;ordBusy=true;try{await saveOrder0(status)}finally{ordBusy=false}}
async function saveOrder0(status){
  if(!S.cart.length){toast('Keranjang masih kosong.');return}
  var when=S.f.when?new Date(S.f.when):new Date();
  if(isNaN(when)){toast('Waktu pesanan belum valid.');return}
  status=status||'waiting';
  D.seq=await nextSeq();
  var paid=status==='paid';
  var o={id:'o'+uid(),no:D.seq,ts:when.toISOString(),customer:S.f.customer.trim(),table:S.f.table.trim(),note:S.f.note.trim(),svc:S.f.svc,
    items:S.cart.map(function(i){return {name:i.name,price:i.price,qty:i.qty,note:i.note.trim(),custom:i.custom}}),
    pay:paid?{status:'paid',method:S.f.method,at:new Date().toISOString()}:{status:status},coll:status==='collective',by:me.username};
  D.orders.push(o);save();
  S.cart=[];S.paySheet=false;S.last=o.id;
  S.f={customer:'',table:'',note:'',when:null,pay:'waiting',method:S.f.method,svc:S.f.svc};
  drawGrid();drawCart();
  toast('Pesanan '+num(o.no)+' disimpan ('+rp(otot(o))+', '+ST[o.pay.status].toLowerCase()+(paid?' · '+o.pay.method:'')+')');
  if(D.receipt.auto)printReceipt(o.id);
}

/* ---------- struk ---------- */
function n3(n){return Math.round(n).toLocaleString('id-ID')}
function byName(o){var u=D.users.filter(function(x){return x.username===o.by})[0];return u?u.name:(o.by||'')}
function receiptHTML(o){
  var d=new Date(o.ts),paid=o.pay.status==='paid',t=otot(o),rc=D.receipt;
  var h='<div class="rc-c rc-shop">'+esc(D.shop)+'</div>'+(rc.addr?'<div class="rc-c">'+esc(rc.addr).replace(/\n/g,'<br>')+'</div>':'')+(rc.tel?'<div class="rc-c">Telp. '+esc(rc.tel)+'</div>':'')+
    '<div class="rc-hr"></div><div class="rc-row"><span>'+ymd(d)+'</span><span>'+esc(o.customer||'')+'</span></div><div class="rc-row"><span>'+pad(d.getHours())+':'+pad(d.getMinutes())+'</span><span>'+esc(byName(o))+'</span></div>'+
    '<div class="rc-row"><span>No.'+num(o.no)+'</span><span>'+(o.table?'Meja '+esc(o.table):'')+'</span></div>'+(o.svc?'<div>'+esc(o.svc)+'</div>':'')+'<div class="rc-hr"></div>';
  o.items.forEach(function(i){h+='<div>'+esc(i.name)+'</div><div class="rc-row"><span>'+i.qty+' X '+n3(i.price)+'</span><span>Rp '+n3(i.price*i.qty)+'</span></div>'+(i.note?'<div class="rc-n">* '+esc(i.note)+'</div>':'')});
  h+='<div class="rc-hr"></div><div class="rc-row rc-b"><span>Total</span><span>'+n3(t)+'</span></div>';
  h+=paid?'<div class="rc-row"><span>Bayar ('+esc(o.pay.method)+')</span><span>'+n3(t)+'</span></div>':'<div class="rc-row rc-b"><span>Status</span><span>'+(o.pay.status==='collective'?'KOLEKTIF':'BELUM LUNAS')+'</span></div>';
  if(o.note)h+='<div class="rc-hr"></div><div>Ket: '+esc(o.note)+'</div>';
  return h+'<div class="rc-hr"></div><div class="rc-c">'+esc(rc.foot||'Terima kasih')+'</div><div class="rc-c">&nbsp;</div>';
}
function printReceipt(id){
  var o=D.orders.filter(function(x){return x.id===id})[0];if(!o){toast('Pesanan tidak ditemukan.');return}
  var big=D.receipt.paper==='80',w=big?'80mm':'58mm',c=big?'74mm':'52mm';
  var css='@page{size:'+w+' auto;margin:3mm}*{box-sizing:border-box}html,body{margin:0;background:#fff;color:#000}body{width:'+c+';font:12px/1.35 "Courier New",monospace}'+
    '.rc-c{text-align:center}.rc-shop{font-weight:700;font-size:16px}.rc-hr{border-top:1px dashed #000;margin:6px 0}.rc-row{display:flex;justify-content:space-between;gap:6px}.rc-row span:last-child{text-align:right;white-space:nowrap}.rc-b{font-weight:700}.rc-n{font-size:11px;padding-left:8px}div{overflow-wrap:anywhere}';
  var old=document.getElementById('rcframe');if(old)old.remove();
  var f=document.createElement('iframe');f.id='rcframe';f.style.cssText='position:fixed;right:0;bottom:0;width:0;height:0;border:0;visibility:hidden';
  document.body.appendChild(f);
  var d=f.contentWindow.document;d.open();d.write('<!doctype html><html><head><meta charset="utf-8"><title>Struk '+num(o.no)+'</title><style>'+css+'</style></head><body>'+receiptHTML(o)+'</body></html>');d.close();
  setTimeout(function(){try{f.contentWindow.focus();f.contentWindow.print()}catch(e){toast('Cetak tidak tersedia di peramban ini.')}setTimeout(function(){if(f.parentNode)f.remove()},60000)},250);
}

/* ---------- pesanan ---------- */
function viewPesanan(){
  var rg=[['today','Hari ini'],['7d','7 hari'],['month','Bulan ini'],['all','Semua']];
  var st=[['all','Semua'],['waiting','Menunggu'],['collective','Kolektif'],['paid','Lunas']];
  function chips(list,key,cur){return '<div class="chips">'+list.map(function(x){return '<button class="chip" data-act="'+key+'" data-v="'+x[0]+'" aria-pressed="'+(cur===x[0])+'">'+x[1]+'</button>'}).join('')+'</div>'}
  return '<div class="toolbar">'+chips(rg,'orange',S.of.range)+
    '<label class="f" for="od">Lihat tanggal tertentu<input class="inp sm" id="od" type="date" data-f="odate" value="'+esc(S.of.date)+'"></label>'+chips(st,'ostatus',S.of.status)+
    '<label class="sr" for="oq">Cari pesanan</label><input id="oq" data-f="oq" class="inp" type="search" placeholder="Cari nama, meja, atau nomor pesanan" value="'+esc(S.of.q)+'" autocomplete="off"></div>'+
    '<div id="osum" class="osum"></div><div id="olist" class="olist"></div>';
}
function drawOrders(){
  var s=$('osum'),l=$('olist');if(!s||!l)return;
  var q=S.of.q.trim().toLowerCase();
  var list=D.orders.filter(function(o){return inRange(o,S.of.range)&&(S.of.status==='all'||o.pay.status===S.of.status)&&(!q||(o.customer+' '+o.table+' '+num(o.no)).toLowerCase().indexOf(q)>=0)})
    .sort(function(a,b){return new Date(b.ts)-new Date(a.ts)});
  var un=list.filter(function(o){return o.pay.status!=='paid'}).reduce(function(t,o){return t+otot(o)},0);
  s.textContent=list.length+' pesanan'+(un?' · belum lunas '+rp(un):'');
  l.innerHTML=list.length?list.map(orderCard).join(''):'<div class="empty" style="grid-column:1/-1">Belum ada pesanan pada pilihan ini. Buat pesanan baru di tab Kasir.</div>';
}
function orderCard(o){

    :'<button class="btn ghost sm danger-t" data-act="delask" data-id="'+o.id+'">Hapus</button>';
  act='<button class="btn ghost sm" data-act="eoopen" data-id="'+o.id+'">Ubah nama/meja</button><button class="btn ghost sm" data-act="printrc" data-id="'+o.id+'">Cetak struk</button>'+act;
  return '<article class="panel oc"><div class="oc-h"><div><b>'+num(o.no)+'</b> <span class="muted">'+(o.table?'· Meja '+esc(o.table):'')+(o.customer?' · '+esc(o.customer):'')+'</span>'+(o.edited?'<span class="tag">diubah</span>':'')+

function repData(k){
  var orders=D.orders.filter(function(o){return inRange(o,k)}).sort(function(a,b){return new Date(a.ts)-new Date(b.ts)});
  var exps=D.expenses.filter(function(x){return inRange(x,k)}).sort(function(a,b){return new Date(a.ts)-new Date(b.ts)});
  var s={n:orders.length,paid:0,waiting:0,coll:0,np:0,nw:0,nc:0,all:0,exp:0,nx:exps.length};
  var days={},meth={},xcat={};METHODS.forEach(function(m){meth[m]=0});
  function dg(ts){var d=new Date(ts),key=ymd(d);return days[key]||(days[key]={d:new Date(d.getFullYear(),d.getMonth(),d.getDate()),n:0,paid:0,waiting:0,coll:0,all:0,exp:0,m:{Cash:0,QRIS:0,Transfer:0}})}
  orders.forEach(function(o){
    var t=otot(o),g=dg(o.ts);g.n++;g.all+=t;s.all+=t;
    if(o.pay.status==='paid'){s.paid+=t;s.np++;g.paid+=t;meth[o.pay.method]=(meth[o.pay.method]||0)+t;g.m[o.pay.method]=(g.m[o.pay.method]||0)+t}
    else if(o.pay.status==='collective'){s.coll+=t;s.nc++;g.coll+=t}
    else{s.waiting+=t;s.nw++;g.waiting+=t}
  });
  exps.forEach(function(x){var g=dg(x.ts);g.exp+=x.amount;s.exp+=x.amount;xcat[x.cat]=(xcat[x.cat]||0)+x.amount});
  return {orders:orders,exps:exps,sum:s,days:Object.keys(days).sort().map(function(x){return days[x]}),meth:meth,xcat:xcat};
}
function payText(o){return o.pay.status==='paid'?'Lunas ('+o.pay.method+')':ST[o.pay.status]}

function exportCsv(){

document.addEventListener('submit',async function(e){
  var form=e.target.closest('[data-form]');if(!form)return;
  e.preventDefault();
  var fd=new FormData(form),kind=form.dataset.form;
  if(kind==='login'){
    var un=String(fd.get('u')||'').trim().toLowerCase(),p=String(fd.get('p')||'');
    var u=D.users.filter(function(x){return x.username.toLowerCase()===un})[0];
    if(u&&u.pw===await pw(u.username,p)){me=u;lsSet(SKEY,u.id);S.loginErr='';S.view='kasir';render()}
    else{S.loginErr='Nama pengguna atau sandi salah.';$('lerr').textContent=S.loginErr}
    return;
  }
  if(!me)return;
  if(kind==='custom'){
    var name=String(fd.get('name')||'').trim(),price=parsePrice(fd.get('price')),qty=parsePrice(fd.get('qty'));
    if(!name||price<=0||qty<1){toast('Isi nama, harga, dan jumlah dengan benar.');return}
    for(var q=0;q<qty;q++)addToCart('c:'+name.toLowerCase()+':'+price,name,price,true);
    drawCart();toast('Ditambahkan: '+name);return;
  }
  if(kind==='editorder'){
    var o=ord(fd.get('id'));if(o){o.customer=String(fd.get('customer')||'').trim();o.table=String(fd.get('table')||'').trim();o.note=String(fd.get('note')||'').trim();o.edited=new Date().toISOString();save();S.edit=null;drawOrders();toast('Pesanan diubah')}
    return;
  }
  if(kind==='myname'){var nm0=String(fd.get('name')||'').trim();if(nm0){me.name=nm0;save();S.msg.myname={t:'Nama diganti.',ok:true}}render();return}
  if(kind==='mypw'){
    var cur=String(fd.get('cur')),n1=String(fd.get('n1')),n2=String(fd.get('n2'));
    if(me.pw!==await pw(me.username,cur))S.msg.mypw={t:'Sandi sekarang salah.',ok:false};
    else if(n1.length<4)S.msg.mypw={t:'Sandi baru minimal 4 karakter.',ok:false};
    else if(n1!==n2)S.msg.mypw={t:'Ulangan sandi tidak sama.',ok:false};
    else{me.pw=await pw(me.username,n1);D.showHint=false;save();S.msg.mypw={t:'Sandi diganti.',ok:true}}
    renderView();return;
  }
  if(!needOwner())return;
  if(kind==='addmenu'){
    var mn=String(fd.get('name')||'').trim(),mp=parsePrice(fd.get('price'));
    if(!mn||mp<=0){S.msg.menu='Isi nama menu dan harga lebih dari 0.';renderView();return}
    D.menu.push({id:'m'+uid(),name:mn,cat:fd.get('cat')==='Minuman'?'Minuman':'Makanan',group:String(fd.get('group')||'').trim(),price:mp,active:true});
    save();S.msg.menu='';renderView();toast('Menu disimpan: '+mn);return;
  }
  if(kind==='editmenu'){
    var m=mnu(fd.get('id')),n=String(fd.get('name')).trim(),pp=parsePrice(fd.get('price'));
    if(m&&n&&pp>0){m.name=n;m.cat=fd.get('cat')==='Minuman'?'Minuman':'Makanan';m.group=String(fd.get('group')||'').trim();m.price=pp;save();S.edit=null;renderView()}else toast('Data menu belum benar.');
    return;
  }
  if(kind==='addexp'){
    var xp=String(fd.get('date')||'').split('-'),xn=new Date();
    var xdt=xp.length===3?new Date(+xp[0],+xp[1]-1,+xp[2],xn.getHours(),xn.getMinutes()):null;
    var xname=String(fd.get('name')||'').trim(),xamt=parsePrice(fd.get('amount'));
    if(!xdt||isNaN(xdt)||!xname||xamt<=0)S.msg.exp={t:'Isi tanggal, keterangan, dan jumlah lebih dari 0.',ok:false};
    else{D.expenses.push({id:'e'+uid(),ts:xdt.toISOString(),name:xname,cat:String(fd.get('cat')||'Lain-lain'),amount:xamt,note:String(fd.get('note')||'').trim(),by:me.username});save();S.msg.exp={t:'Pengeluaran dicatat: '+xname+' ('+rp(xamt)+').',ok:true}}
    renderView();return;
  }
  if(kind==='shop'){var s=String(fd.get('shop')).trim();if(s){D.shop=s;save();S.msg.shop={t:'Nama usaha disimpan.',ok:true};render()}return}
  if(kind==='receipt'){D.receipt={addr:String(fd.get('addr')||'').trim(),tel:String(fd.get('tel')||'').trim(),foot:String(fd.get('foot')||'').trim(),paper:fd.get('paper')==='80'?'80':'58',auto:!!fd.get('auto')};save();S.msg.receipt={t:'Pengaturan struk disimpan.',ok:true};renderView();return}
  if(kind==='adduser'){
    var nn=String(fd.get('name')).trim(),us=String(fd.get('username')).trim().toLowerCase(),pwd=String(fd.get('pw'));
    if(!nn||!us)S.msg.users={t:'Isi nama dan nama pengguna.',ok:false};
    else if(/\s/.test(us))S.msg.users={t:'Nama pengguna tidak boleh memakai spasi.',ok:false};
    else if(pwd.length<4)S.msg.users={t:'Sandi minimal 4 karakter.',ok:false};
    else if(D.users.some(function(x){return x.username.toLowerCase()===us}))S.msg.users={t:'Nama pengguna sudah dipakai.',ok:false};
    else{D.users.push({id:'u'+uid(),username:us,name:nn,role:'staff',pw:await pw(us,pwd)});save();S.msg.users={t:'Karyawan ditambahkan. Berikan nama pengguna dan sandi awalnya.',ok:true}}
    renderView();return;
  }
  if(kind==='resetpw'){
    var tu=D.users.filter(function(x){return x.id===fd.get('id')&&x.role==='staff'})[0],np=String(fd.get('pw'));
    if(tu&&np.length>=4){tu.pw=await pw(tu.username,np);save();S.resetId=null;S.msg.users={t:'Sandi '+tu.name+' diganti.',ok:true}}
    else S.msg.users={t:'Sandi baru minimal 4 karakter.',ok:false};
    renderView();return;
  }
  if(kind==='restore'){
    try{
      var obj=JSON.parse(String(fd.get('json')||''));if(!validData(obj))throw new Error('x');
      D=fix(obj);save();
      me=D.users.filter(function(x){return x.id===me.id})[0]||null;
      if(!me){lsDel(SKEY);render();return}
      S.msg.data={t:'Data dipulihkan.',ok:true};render();
    }catch(err){S.msg.data={t:'Cadangan tidak valid. Pastikan seluruh teks tersalin utuh.',ok:false};renderView()}
  }
});

/* ---------- sinkronisasi antar perangkat (Firebase Realtime Database) ---------- */
var COLS=['users','menu','orders','expenses'];
var CLOUD_ON=!!(FIREBASE_CONFIG.apiKey&&FIREBASE_CONFIG.databaseURL&&String(SHOP_ID).length>=12);
var OBOX='kasir-biru-outbox', SYNCED='kasir-biru-sync-'+SHOP_ID, REMK='kasir-biru-rem-'+SHOP_ID;
var cloud={root:null,first:false,empty:false,booted:false,online:null,rem:null,err:'',failed:false,hasBase:false};
var firstResolve=function(){};

function hs(s){var h=5381;for(var i=0;i<s.length;i++)h=((h<<5)+h+s.charCodeAt(i))|0;return (h>>>0).toString(36)+s.length}
function stable(x){
  if(x===null||typeof x!=='object')return JSON.stringify(x);
  if(Array.isArray(x))return '['+x.map(stable).join(',')+']';
  return '{'+Object.keys(x).sort().filter(function(k){return x[k]!==undefined&&x[k]!==null}).map(function(k){return JSON.stringify(k)+':'+stable(x[k])}).join(',')+'}';
}
function clean(x){return JSON.parse(JSON.stringify(x))}
function metaOf(d){return {v:1,shop:d.shop,seq:d.seq||0,receipt:d.receipt,showHint:!!d.showHint}}
function emptyState(){return {meta:'',users:{},menu:{},orders:{},expenses:{}}}
function snapState(d){var s=emptyState();s.meta=hs(stable(metaOf(d)));COLS.forEach(function(c){(d[c]||[]).forEach(function(it){s[c][it.id]=hs(stable(it))})});return s}
function sameState(a,b){
  if(a.meta!==b.meta)return false;
  return COLS.every(function(c){var x=a[c],y=b[c],kx=Object.keys(x);return kx.length===Object.keys(y).length&&kx.every(function(k){return x[k]===y[k]})});
}
function fromRemote(v){
  var m=v.meta||{},d={v:1,shop:m.shop||'Tongkrongan OK',seq:m.seq||0,receipt:m.receipt||{},showHint:!!m.showHint};
  COLS.forEach(function(c){
    var o=v[c]||{};
    d[c]=Object.keys(o).map(function(k){var it=o[k];if(it&&typeof it==='object'&&!it.id)it.id=k;return it}).filter(function(it){return it&&typeof it==='object'});
  });
  d.orders.sort(function(a,b){return (a.no||0)-(b.no||0)||String(a.ts).localeCompare(String(b.ts))});
  d.expenses.sort(function(a,b){return String(a.ts).localeCompare(String(b.ts))});
  d.users.sort(function(a,b){return (a.role==='owner'?0:1)-(b.role==='owner'?0:1)||String(a.id).localeCompare(String(b.id))});
  return d;
}

/* antrean tulis: perubahan yang belum dikonfirmasi server (aman walau aplikasi ditutup saat offline) */
function obRead(){try{return JSON.parse(lsGet(OBOX)||'{}')||{}}catch(e){return {}}}
function obWrite(o){if(Object.keys(o).length)lsSet(OBOX,JSON.stringify(o));else lsDel(OBOX)}
function obDone(up){var o=obRead();Object.keys(up).forEach(function(k){if(k in o&&stable(o[k])===stable(up[k]))delete o[k]});obWrite(o);syncStatus()}
function cloudWrite(up){
  obWrite(Object.assign(obRead(),up));syncStatus();
  return cloud.root.update(up).then(function(){obDone(up)}).catch(function(e){
    if(e&&e.code==='PERMISSION_DENIED'){obDone(up);cloud.err='Server menolak penyimpanan. Periksa Rules di Firebase.';toast(cloud.err)}
    syncStatus();
  });
}
function cloudPush(){
  if(!D)return;
  if(!cloud.first&&!cloud.hasBase)return;
  var cur=snapState(D),rem=cloud.rem||emptyState(),up={};
  if(cur.meta!==rem.meta)up.meta=clean(metaOf(D));
  COLS.forEach(function(c){
    var by={};D[c].forEach(function(it){by[it.id]=it});
    Object.keys(cur[c]).forEach(function(id){if(rem[c][id]!==cur[c][id])up[c+'/'+id]=clean(by[id])});
    Object.keys(rem[c]).forEach(function(id){if(!(id in cur[c]))up[c+'/'+id]=null});
  });
  if(!Object.keys(up).length)return;
  cloud.rem=cur;
  if(cloud.root&&cloud.first)cloudWrite(up);else{obWrite(Object.assign(obRead(),up));syncStatus()}
}
function pushAll(){cloud.rem=emptyState();cloudPush()}

async function nextSeq(){
  var ls=Math.max(D.seq,D.orders.reduce(function(m,x){return Math.max(m,x.no||0)},0))+1;
  if(!(CLOUD_ON&&cloud.root&&cloud.first&&cloud.online))return ls;
  try{
    var r=await Promise.race([
      cloud.root.child('meta/seq').transaction(function(c){return Math.max(c||0,ls-1)+1}),
      new Promise(function(_,rej){setTimeout(function(){rej(new Error('timeout'))},3000)})]);
    if(r&&r.committed&&typeof r.snapshot.val()==='number')return r.snapshot.val();
  }catch(e){}
  return ls;
}

function typing(){var a=document.activeElement;return !!a&&/^(INPUT|TEXTAREA|SELECT)$/.test(a.tagName)}
function refreshRemote(full){
  if(!me){if(!typing())render();return}
  if(full&&!typing()){render();return}
  var v=S.view;
  if(v==='kasir'){drawCats();drawGrid();if(!typing())drawCart();updateDock()}
  else if(v==='pesanan')drawOrders();
  else if(v==='menu'){if(!typing())drawMenuList()}
  else if(!typing())renderView();
}
function onRemote(snap){
  var v=snap.val(),firstTime=!cloud.first;
  var nd=(v&&v.meta)?fix(fromRemote(v)):null;
  if(!nd||!validData(nd)){
    if(firstTime){cloud.first=true;cloud.empty=true;cloud.rem=emptyState();firstResolve();if(cloud.booted&&D)pushAll()}
    syncStatus();return;
  }
  var had=D,changed=!had||!sameState(snapState(had),snapState(nd));
  if(firstTime&&had&&changed&&!lsGet(SYNCED)&&(had.orders.length||had.menu.length))lsSet(KEY+'-lokal',JSON.stringify(had));
  cloud.first=true;cloud.rem=snapState(nd);D=nd;
  lsSet(SYNCED,'1');lsSet(REMK,JSON.stringify(cloud.rem));lsSet(KEY,JSON.stringify(D));
  if(firstTime){firstResolve();setTimeout(function(){var ob=obRead();if(Object.keys(ob).length&&cloud.root)cloudWrite(ob)},0)}
  if(me){
    me=D.users.filter(function(x){return x.id===me.id})[0]||null;
    if(!me){lsDel(SKEY);S.cart=[];toast('Akun Anda sudah tidak tersedia. Silakan masuk lagi.');render();syncStatus();return}
  }
  if(cloud.booted&&(changed||firstTime))refreshRemote(firstTime);
  syncStatus();
}

function syncState(){
  if(!CLOUD_ON)return ['local','Mode lokal','off'];
  if(cloud.failed&&!cloud.root)return ['offline','Offline','off'];
  if(cloud.online===null&&!cloud.first)return ['connecting','Menyambungkan…','wait'];
  if(!cloud.online)return ['offline','Offline','off'];
  if(!cloud.first)return ['connecting','Menyambungkan…','wait'];
  if(Object.keys(obRead()).length)return ['pending','Menyimpan…','wait'];
  return ['online','Tersinkron','on'];
}
function syncStatus(){var el=$('sync'),s=syncState();if(el){el.className='sync '+s[2];el.textContent=s[1]}var b=$('syncbox');if(b){b.className='syncbox '+s[2];b.querySelector('span').textContent=s[1]+(cloud.err&&s[0]!=='online'?' — '+cloud.err:'')}}
function syncPanel(){
  var s=syncState();
  var txt=CLOUD_ON?'Pesanan, menu, pengeluaran, dan akun disimpan di server Firebase dan langsung muncul di semua perangkat (pemilik maupun kasir) yang membuka aplikasi ini. Bila internet putus, aplikasi tetap bisa dipakai dan data dikirim otomatis saat tersambung lagi.':'Sinkronisasi belum aktif. Isi FIREBASE_CONFIG di bagian atas file index.html agar data bisa dipakai bersama di banyak perangkat.';
  return '<div class="panel stack"><h3>Sinkronisasi antar perangkat</h3><p class="hint">'+txt+'</p><div id="syncbox" class="syncbox '+s[2]+'"><span>'+esc(s[1]+(cloud.err&&s[0]!=='online'?' — '+cloud.err:''))+'</span></div>'+
    (CLOUD_ON?'<p class="hint">Kode toko: <b>'+esc(String(SHOP_ID).slice(0,4))+'••••••••</b> (harus sama di semua perangkat)</p>':'')+'</div>';
}

function loadScript(u){return new Promise(function(res,rej){var s=document.createElement('script');s.src=u;s.onload=res;s.onerror=function(){rej(new Error('Tidak bisa memuat Firebase (periksa internet).'))};document.head.appendChild(s)})}
function cloudFail(e){
  var c=e&&e.code||'',m=e&&e.message||'Gagal tersambung.';
  if(c==='auth/operation-not-allowed'||c==='auth/admin-restricted-operation')m='Login Anonymous belum diaktifkan di Firebase Authentication.';
  else if(c==='auth/unauthorized-domain')m='Domain situs ini belum ditambahkan di Authentication > Settings > Authorized domains.';
  else if(c==='PERMISSION_DENIED'||/permission_denied/i.test(m))m='Rules Firebase menolak akses. Periksa Rules dan kode toko.';
  cloud.failed=true;cloud.err=m;syncStatus();firstResolve();
}
function cloudStart(){
  return new Promise(function(resolve){
    firstResolve=resolve;
    var base='https://www.gstatic.com/firebasejs/10.12.5/';
    loadScript(base+'firebase-app-compat.js')
      .then(function(){return Promise.all([loadScript(base+'firebase-auth-compat.js'),loadScript(base+'firebase-database-compat.js')])})
      .then(function(){firebase.initializeApp(FIREBASE_CONFIG);return firebase.auth().signInAnonymously()})
      .then(function(){
        var db=firebase.database();
        cloud.root=db.ref('toko/'+SHOP_ID);
        db.ref('.info/connected').on('value',function(s){cloud.online=!!s.val();syncStatus()});
        cloud.root.on('value',onRemote,cloudFail);
      }).catch(cloudFail);
    setTimeout(resolve,9000);
  });
}
function bootHTML(){return '<div class="boot"><span class="logo">'+logoImg()+'</span><b>'+esc((D&&D.shop)||'Tongkrongan OK')+'</b><span>Menyambungkan ke server…</span></div>'}

/* ---------- mulai ---------- */
(async function(){
  D=load();
  if(CLOUD_ON){
    try{var rm=lsGet(SYNCED)&&lsGet(REMK);if(rm){cloud.rem=JSON.parse(rm);cloud.hasBase=true}}catch(e){}
    $('app').innerHTML=bootHTML();
    await cloudStart();
    if(!cloud.first&&!cloud.failed){cloud.err='Server belum merespons. Memakai data di perangkat ini.';toast(cloud.err)}
  }
  if(!D)D=await seed();
  if(CLOUD_ON&&cloud.root&&cloud.first&&cloud.empty){cloud.empty=false;pushAll()}
  save();
  cloud.booted=true;
  var sn=lsGet(SKEY);
  if(sn)me=D.users.filter(function(x){return x.id===sn})[0]||null;
  render();
})();
})();
</script>
